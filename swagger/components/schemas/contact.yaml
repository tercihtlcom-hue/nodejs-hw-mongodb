type: object
properties:
  _id:
    type: string
    description: Contact's unique identifier
    example: '65e4decdd286b30065d54af9'
  name:
    type: string
    description: Contact's full name
    minLength: 3
    maxLength: 20
    example: 'John Doe'
  phoneNumber:
    type: string
    description: Contact's phone number
    minLength: 3
    maxLength: 20
    example: '+380501234567'
  email:
    type: string
    description: Contact's email address
    example: 'john.doe@example.com'
  isFavourite:
    type: boolean
    description: Whether the contact is marked as favourite
    default: false
    example: false
  contactType:
    type: string
    description: Type of the contact
    enum: ['work', 'home', 'personal']
    default: 'personal'
    example: 'personal'
  userId:
    type: string
    description: Identifier of the user who owns the contact
    example: '65e4de6ad286b30065d54af5'
  createdAt:
    type: string
    format: date-time
    example: '2024-03-04T10:00:00.000Z'
  updatedAt:
    type: string
    format: date-time
    example: '2024-03-04T10:00:00.000Z'
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
