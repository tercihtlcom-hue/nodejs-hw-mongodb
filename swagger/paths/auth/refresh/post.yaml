post:
  tags:
    - Auth
  summary: Refresh session
  operationId: refreshUserSession
  description: >
    Refreshes the current session using the sessionId and refreshToken
    stored in httpOnly cookies, and returns a new access token.
  responses:
    '200':
      description: Successfully refreshed session.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: number
                example: 200
              message:
                type: string
                example: 'Successfully refreshed a session!'
              data:
                type: object
                properties:
                  accessToken:
                    type: string
                    example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
    '401':
      description: Unauthorized. Refresh token or session id is missing or invalid.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: number
                example: 401
              message:
                type: string
                example: 'Refresh token or session id is missing'
