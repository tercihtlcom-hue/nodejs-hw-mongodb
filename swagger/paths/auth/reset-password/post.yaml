post:
  tags:
    - Auth
  summary: Reset password
  operationId: resetPassword
  description: Sets a new password for the user identified by the provided reset token.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            password:
              type: string
              minLength: 6
              maxLength: 64
              example: 'myNewPass123'
            token:
              type: string
              example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
          required:
            - password
            - token
  responses:
    '200':
      description: Successfully reset password.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: number
                example: 200
              message:
                type: string
                example: 'Password was successfully reset!'
              data:
                type: object
                example: {}
    '401':
      description: Unauthorized. Token is invalid or expired.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: number
                example: 401
              message:
                type: string
                example: 'Token is expired or invalid.'
