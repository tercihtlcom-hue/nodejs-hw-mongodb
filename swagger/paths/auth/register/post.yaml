post:
  tags:
    - Auth
  summary: Register a new user
  operationId: registerUser
  description: Creates a new user account.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              minLength: 3
              maxLength: 50
              example: 'John Doe'
            email:
              type: string
              format: email
              example: 'john.doe@example.com'
            password:
              type: string
              minLength: 6
              maxLength: 64
              example: 'mySecretPass123'
          required:
            - name
            - email
            - password
  responses:
    '201':
      description: Successfully registered a user.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: number
                example: 201
              message:
                type: string
                example: 'Successfully registered a user!'
              data:
                type: object
                properties:
                  _id:
                    type: string
                    example: '65e4de6ad286b30065d54af5'
                  name:
                    type: string
                    example: 'John Doe'
                  email:
                    type: string
                    example: 'john.doe@example.com'
    '409':
      description: Conflict. Email is already in use.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: number
                example: 409
              message:
                type: string
                example: 'Email in use'
