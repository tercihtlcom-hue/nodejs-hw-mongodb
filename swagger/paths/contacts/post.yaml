tags:
  - Contacts
summary: Create contact
operationId: createContact
description: Creates a new contact for the currently authenticated user.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: ../../components/schemas/contact-create-request.yaml
responses:
  '201':
    description: Successfully created contact.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: number
              example: 201
            message:
              type: string
              example: 'Successfully created a contact!'
            data:
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ../../components/responses/401.yaml
