tags:
  - Contacts
summary: Update contact
operationId: patchContact
description: Partially updates an existing contact that belongs to the currently authenticated user.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: Id of the contact to update
    schema:
      type: string
      example: '65e4decdd286b30065d54af9'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: ../../../components/schemas/contact-update-request.yaml
responses:
  '200':
    description: Successfully patched contact.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: number
              example: 200
            message:
              type: string
              example: 'Successfully patched a contact!'
            data:
              $ref: ../../../components/schemas/contact.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
