tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: >
  Returns a paginated list of contacts that belong to the currently
  authenticated user. Supports sorting and filtering by contact type
  and favourite status.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    description: Page number to retrieve
    required: false
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: perPage
    in: query
    description: Number of contacts per page
    required: false
    schema:
      type: integer
      minimum: 1
      default: 10
  - name: sortBy
    in: query
    description: Field to sort contacts by
    required: false
    schema:
      type: string
      default: name
      example: name
  - name: sortOrder
    in: query
    description: Sort order
    required: false
    schema:
      type: string
      enum: ['asc', 'desc']
      default: asc
  - name: type
    in: query
    description: Filter contacts by contact type
    required: false
    schema:
      type: string
      enum: ['work', 'home', 'personal']
  - name: isFavourite
    in: query
    description: Filter contacts by favourite status
    required: false
    schema:
      type: boolean
responses:
  '200':
    description: Successfully found contacts.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: number
              example: 200
            message:
              type: string
              example: 'Successfully found contacts!'
            data:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/contact.yaml
                page:
                  type: number
                  example: 1
                perPage:
                  type: number
                  example: 10
                totalItems:
                  type: number
                  example: 25
                totalPages:
                  type: number
                  example: 3
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: true
  '401':
    $ref: ../../components/responses/401.yaml
